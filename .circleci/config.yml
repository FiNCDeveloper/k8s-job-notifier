version: 2.1

orbs:
  aws-ecr: circleci/aws-ecr@9.9.0
  aws-cli: circleci/aws-cli@5.4.2

jobs:
  test:
    docker:
      - image: cimg/go:1.22
    parallelism: 2
    environment:
      TEST_RESULTS: /tmp/test-results
    resource_class: medium.gen2
    steps:
      - checkout
      - run: mkdir -p $TEST_RESULTS
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.sum" }}
      - run:
          name: Install gotestsum
          command: go install gotest.tools/gotestsum@latest
      - run:
          name: Run unit tests
          command: |
            PACKAGE_NAMES=$(go list ./... | circleci tests split --split-by=timings --timings-type=classname)
            gotestsum --junitfile ${TEST_RESULTS}/gotestsum-report.xml -- $PACKAGE_NAMES
      - save_cache:
          key: go-mod-v4-{{ checksum "go.sum" }}
          paths:
            - "/home/circleci/go/pkg/mod"
      - store_artifacts:
          path: /tmp/test-results
          destination: raw-test-output
      - store_test_results:
          path: /tmp/test-results

  build_and_push:
    machine:
      enabled: true
      docker_layer_caching: true
    working_directory: ~/go/src/github.com/FiNCDeveloper/job_notifier
    steps:
      - checkout
      # OIDC で circleci-oidc-role2 を AssumeRole する。
      # set_aws_env_vars（既定 true）により一時認証情報が BASH_ENV に書かれ、
      # 後続ステップでは context default の静的キーより優先される
      - aws-ecr/build_and_push_image:
          checkout: false
          auth:
            - aws-cli/setup:
                role_arn: "arn:aws:iam::759549166074:role/circleci-oidc-role2"
                role_session_name: "circleci-session"
                session_duration: "3600"
                region: ap-northeast-1
          account_id: "759549166074"
          region: ap-northeast-1
          create_repo: true
          no_output_timeout: 10m
          repo: job_notifier
          skip_when_tags_exist: false
          tag: 'latest,${CIRCLE_SHA1},${CIRCLE_TAG}'

workflows:
  version: 2
  build_and_push:
    jobs:
      - test:
          context: default
          filters: # tagの場合はrequireで実行されるjobにも必要
            tags:
              only: /^\d+\.\d+\.\d+$/
      - build_and_push:
          requires:
            - test
          context: default
          filters:
            branches:
              only:
                - main
            tags:
              only: /^\d+\.\d+\.\d+$/
